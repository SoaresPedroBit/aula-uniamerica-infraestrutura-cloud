services:
  frontend:
    build:
      context: ./frontend
      args:
        - REACT_APP_API_URL=${REACT_APP_API_URL:-http://localhost:5000}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    networks:
      - todo-net
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    environment:
      - PORT=${BACKEND_PORT:-5000}
      - MONGO_URI=mongodb://${MONGO_ROOT_USER}:${MONGO_ROOT_PASSWORD}@mongo-todo:27017/${MONGO_DB_NAME}?authSource=admin
    networks:
      - todo-net
    depends_on:
      - mongo

  mongo:
    build:
      context: ./banco-de-dados
    container_name: mongo-todo
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - todo-net
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USER}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD}
      - MONGO_INITDB_DATABASE=${MONGO_DB_NAME}

networks:
  todo-net:
    driver: bridge

volumes:
  mongo-data:
    driver: local